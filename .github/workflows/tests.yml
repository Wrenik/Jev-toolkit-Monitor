name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Wrenik/Jev-toolkit-usage
          path: usage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The dependency repo is installed editable from its checkout, so CI works before any release.
      - run: python -m pip install -e ./usage
      - run: python -m pip install -e ".[dev]" --no-deps
      # Offline tests only: no API key is configured in CI and none is needed.
      - run: python -m pytest
        env:
          JEV_JUDGE: fake
