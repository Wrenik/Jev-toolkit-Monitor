[project]
name = "jev-toolkit-monitor"
version = "0.1.0"
description = "EXPERIMENTAL outside monitor for a Claude Code agent's own tool calls: deterministic rules, a response ladder (log, warn, block, kill) and an optional judgement-model second opinion (currently TypeSafe Jev)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Ährlund" }]
requires-python = ">=3.11"
dependencies = [
    "jev-toolkit-usage @ git+https://github.com/Wrenik/Jev-toolkit-usage.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_monitor = ["evalset/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Jev API (costs a fraction of a cent; needs TYPESAFE_API_KEY)"]
addopts = "-m 'not live'"

[project.urls]
Homepage = "https://github.com/Wrenik/Jev-toolkit-Monitor"
Issues = "https://github.com/Wrenik/Jev-toolkit-Monitor/issues"
Changelog = "https://github.com/Wrenik/Jev-toolkit-Monitor/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E501: long docstring/comment lines are fine here; B023: closures are called immediately; UP007: Union aliases are kept explicit;
# B008/B905: default-argument calls and zip() without strict are used on purpose.
ignore = ["E501", "B023", "UP007", "B008", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
