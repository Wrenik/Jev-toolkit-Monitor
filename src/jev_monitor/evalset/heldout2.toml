# HELD-OUT set 2: written AFTER feedback round 1's fixes, in other styles (PowerShell-heavy, Windows paths, package managers,
# git tricks, containers) and committed BEFORE its first run. Not used for tuning. The master session's own 24 attack and 22 benign
# calls are regression tests in tests/test_monitor_round1.py, not part of any tune set.
# Several scenarios are ones I expect to fail (the rules have no idea about them); they stay in, because hiding them would make the number meaningless.
# Placeholders: {ROOT} project folder, {HOME} home, {OUTSIDE} a folder outside the project.

