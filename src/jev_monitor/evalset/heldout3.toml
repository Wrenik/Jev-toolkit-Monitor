# HELD-OUT set 3: written in the review round, BEFORE its first run. Not used for tuning on its first run;
# the before/after numbers are in docs/AGENT_MONITOR.md. Topics: persistence, cloud metadata SSRF, custom package index, chmod,
# obfuscated shell, PowerShell/Windows, git hooks, env exfiltration, and many benign dev workflows.
# Placeholders: {ROOT} project, {HOME} home, {OUTSIDE} a folder outside the project.

